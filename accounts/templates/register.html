{% extends 'main.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
 <div class="bg-secondary py-5 my-5 rounded-5" style="background: url('{% static 'images/bg-leaves-img-pattern.png' %}') no-repeat center/cover;">
  <div class="container my-5">
    <div class="row align-items-center">

      <!-- Ліва частина -->
      <div class="col-md-6 p-5 text-light">
        <h2 class="display-5 fw-bold">
          Welcome back to <span class="text-warning">PetCoShop</span> 🐾
        </h2>
        <p class="lead">
          Увійдіть, щоб продовжити покупки або керувати своїми замовленнями.
        </p>
      </div>

      <!-- Права частина -->
      <div class="col-md-6 p-5">
        <div class="bg-white rounded-4 shadow-lg p-4">
          <h3 class="mb-4 text-center">Реєстрація</h3>
          <!-- LOGIN FORM -->
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-success btn-lg">Зареєструватися</button>
            </div>

            <div class="text-center">
              <p class="mb-0">Вже маєте акаунт?</p>
              <a href="{% url 'accounts:login' %}" class="text-decoration-none">Увійти</a>
            </div>
          </form>
        </div>
      </div>
</div>

{% endblock %}
