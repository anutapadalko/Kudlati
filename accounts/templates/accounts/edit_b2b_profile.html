{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-lg rounded-4 border-0">
        <div class="card-header bg-primary text-white rounded-top-4 py-3 d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Редагувати B2B профіль 🧾</h3>
          <a href="{% url 'accounts:b2b_profile' %}" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Назад
          </a>
        </div>

        <div class="card-body bg-light">
          <form method="post">
            {% csrf_token %}

            {% for field in form %}
              <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                  <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
              </div>
            {% endfor %}

            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'accounts:b2b_profile' %}" class="btn btn-outline-secondary btn-lg">Скасувати</a>
              <button type="submit" class="btn btn-success btn-lg">Зберегти зміни</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
