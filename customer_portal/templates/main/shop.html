{% extends 'base.html' %}
{% load static i18n %}

{% block content %}
<section class="py-5 overflow-hidden">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">

        <div class="section-header d-flex justify-content-between">
          <h2 class="section-title">
            {% if category %}{{ category.name }}{% else %}{% trans "Shop" %}{% endif %}
          </h2>
          <div class="d-flex align-items-center">
            <a href="{% url 'catalog:categories' %}" class="btn-link text-decoration-none">
              {% trans "View All Categories →" %}
            </a>
            <div class="swiper-buttons ms-3">
              <button type="button" class="swiper-prev products-carousel-prev btn btn-primary" aria-label="{% trans 'Previous' %}">❮</button>
              <button type="button" class="swiper-next products-carousel-next btn btn-primary" aria-label="{% trans 'Next' %}">❯</button>
            </div>
          </div>
        </div>

      </div>
    </div>
{% include "main/products.html" %}
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.querySelector('.products-carousel');
    if (!el) return;
    new Swiper('.products-carousel', {
      slidesPerView: 4,
      spaceBetween: 24,
      navigation: {
        nextEl: '.products-carousel-next',
        prevEl: '.products-carousel-prev',
      },
      loop: false,
      breakpoints: {
        1400: { slidesPerView: 4 },
        1200: { slidesPerView: 3 },
        992:  { slidesPerView: 3 },
        768:  { slidesPerView: 2 },
        0:    { slidesPerView: 1 }
      }
    });
  });
</script>
{% endblock %}
