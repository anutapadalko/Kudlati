{% load static i18n %}

<section class="py-5 overflow-hidden">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">

        <div class="section-header d-flex flex-wrap justify-content-between mb-5">
          <h2 class="section-title">{% trans "Category" %}</h2>

          <div class="d-flex align-items-center">
            {% if categories %}
                <a href="{% url 'customer_portal:shop' %}" class="btn-link text-decoration-none">
                  {% trans "View All Products →" %}
                </a>
            {% endif %}
            <div class="swiper-buttons">
              <button class="swiper-prev category-carousel-prev btn btn-yellow">❮</button>
              <button class="swiper-next category-carousel-next btn btn-yellow">❯</button>
            </div>
          </div>
        </div>

      </div>
    </div>
    <div class="row">
      <div class="col-md-12">

        <div class="category-carousel swiper">
          <div class="swiper-wrapper">

            {% for c in categories %}
              <a href="{% url 'catalog:category' slug=c.slug %}" class="nav-link category-item swiper-slide">
                <div class="category-icon" aria-hidden="true">
                  {% if c.icon %}
                    <img src="{{ c.icon.url }}" alt="{{ c.name }}" loading="lazy" decoding="async" width="96" height="96">
                  {% else %}
                    <img src="{% static 'images/icon-placeholder.png' %}" alt="{{ c.name }}" loading="lazy" decoding="async" width="96" height="96">
                  {% endif %}
                </div>
                <h3 class="category-title">{{ c.name }}</h3>
              </a>
            {% endfor %}


          </div>
        </div>

      </div>
    </div>
  </div>
</section>
