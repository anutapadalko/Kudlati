{% extends "base.html" %}

{% block content %}
{% include "main/hello_section.html" %}
{% include "main/categories.html" %}
{% endblock %}

{% block extra_js %}
<script>
  new Swiper('.category-carousel', {
    slidesPerView: 6,
    spaceBetween: 24,
    navigation: {
      nextEl: '.category-carousel-next',
      prevEl: '.category-carousel-prev',
    },
    loop: false,
    breakpoints: {
      1400: { slidesPerView: 6 },
      1200: { slidesPerView: 5 },
      992:  { slidesPerView: 4 },
      768:  { slidesPerView: 3 },
      576:  { slidesPerView: 2 },
      0:    { slidesPerView: 1 }
    }
  });
</script>
{% endblock %}
