{% extends 'main.html' %}
{% load static %}

{% block content %}
<div class="bg-secondary py-5 my-5 rounded-5"
     style="background: url('{% static 'images/bg-leaves-img-pattern.png' %}') no-repeat center/cover;">
  <div class="container my-5">
    <div class="row align-items-center">

      <!-- Ліва частина -->
      <div class="col-md-6 p-5 text-light">
        <h2 class="display-5 fw-bold">
          До зустрічі у <span class="text-warning">Kudlati</span> 🐾
        </h2>
        <p class="lead">Сподіваємось побачити вас знову!</p>
      </div>

      <!-- Права частина -->
      <div class="col-md-6 p-5">
        <div class="bg-white rounded-4 shadow-lg p-4 text-center">
          <h3 class="mb-4">Вийти з акаунту</h3>
          <p class="text-muted mb-4">Ви впевнені, що хочете вийти зі свого облікового запису?</p>

          <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-danger btn-lg">Вийти</button>
              <a href="{% url 'customer_portal:index' %}" class="btn btn-outline-secondary btn-lg">Скасувати</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
