{% extends 'main.html' %}

{% load static %}

{% block content %}

<div class="bg-secondary py-5 my-5 rounded-5"
     style="background: url('{% static 'images/bg-leaves-img-pattern.png' %}') no-repeat center/cover;">
  <div class="container my-5">
    <div class="row align-items-center">

      <!-- Ліва частина -->
      <div class="col-md-6 p-5 text-light">
        <h2 class="display-5 fw-bold">
          Welcome back to <span class="text-warning">PetCoShop</span> 🐾
        </h2>
        <p class="lead">
          Увійдіть, щоб продовжити покупки або керувати своїми замовленнями.
        </p>
      </div>

      <!-- Права частина -->
      <div class="col-md-6 p-5">
        <div class="bg-white rounded-4 shadow-lg p-4">
          <h3 class="mb-4 text-center">Увійти в акаунт</h3>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label">Email або логін</label>
              <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="you@example.com">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <a href="#" class="text-decoration-none small text-muted">Забули пароль?</a>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-dark btn-lg">Увійти</button>
            </div>

            <div class="text-center">
              <a href="{#}" class="text-decoration-none">Створити акаунт</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
